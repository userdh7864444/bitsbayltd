    <!-- Google Analytics (GA4) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-B1TSBAY001');
      // gtag.js (~150 KB, Google Tag Manager) is fetched only after the first
      // interaction or 4 seconds, so it doesn't compete with the first render.
      // Events queued above are sent once the library loads.
      (function () {
        var loaded = false;
        function loadGtag() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-B1TSBAY001';
          document.head.appendChild(s);
        }
        ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (type) {
          window.addEventListener(type, loadGtag, { once: true, passive: true });
        });
        setTimeout(loadGtag, 4000);
      })();
    </script>
